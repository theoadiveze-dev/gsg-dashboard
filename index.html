00)\">Objet<\u002Fdiv>\n          <div style=\"{{ aItemsCardStyle }}\">\n            <sc-for list=\"{{ aItems }}\" as=\"i\" hint-placeholder-count=\"8\">\n              <button style=\"{{ i.style }}\" sc-camel-on-click=\"{{ i.pick }}\" style-hover=\"background: var(--color-neutral-900)\">\n                <span style=\"{{ i.labelStyle }}\">{{ i.label }}<\u002Fspan>\n                <span style=\"{{ i.slotStyle }}\">{{ i.slot }}<\u002Fspan>\n                <span style=\"{{ i.badgeStyle }}\">{{ i.badge }}<\u002Fspan>\n              <\u002Fbutton>\n            <\u002Fsc-for>\n          <\u002Fdiv>\n        <\u002Fdiv>\n\n        <sc-if value=\"{{ aNoItems }}\" hint-placeholder-val=\"{{ false }}\">\n          <div style=\"font-size: 12px; color: var(--color-neutral-500)\">Aucun objet remonté pour ce boss à cette difficulté.<\u002Fdiv>\n        <\u002Fsc-if>\n\n        <div style=\"{{ aColStyle }}\">\n          <div style=\"display: flex; align-items: baseline; gap: 8.4px; flex-wrap: wrap\">\n            <h3 style=\"margin: 0; font-size: 19px\">{{ aItem }}<\u002Fh3>\n            <span class=\"tag tag-outline\" style=\"font-size: 10px\">{{ aSlot }}<\u002Fspan>\n            <span style=\"font-size: 11px; letter-spacing: .08em; text-transform: uppercase; color: var(--color-neutral-600)\">{{ aDiffLabel }}<\u002Fspan>\n            <a href=\"{{ aWhLink }}\" target=\"_blank\" rel=\"noopener\" data-wowhead=\"{{ aWhData }}\" style=\"font-size: 12px; margin-left: auto\">Voir sur Wowhead<\u002Fa>\n          <\u002Fdiv>\n\n          <div class=\"card elev-sm\" style=\"gap: 4px; padding: 8.4px 11.2px\">\n            <div>{{ aTip }}<\u002Fdiv>\n            <sc-if value=\"{{ aTipStale }}\" hint-placeholder-val=\"{{ false }}\">\n              <div style=\"font-size: 11px; color: var(--color-neutral-600)\">Fiche affichée au niveau mythique — la version {{ aDiffLower }} n’est pas encore disponible.<\u002Fdiv>\n            <\u002Fsc-if>\n            <sc-if value=\"{{ aSearching }}\" hint-placeholder-val=\"{{ false }}\">\n              <div style=\"font-size: 11px; color: var(--color-neutral-600)\">Recherche de la fiche Wowhead…<\u002Fdiv>\n            <\u002Fsc-if>\n            <sc-if value=\"{{ aNoId }}\" hint-placeholder-val=\"{{ false }}\">\n              <div style=\"font-size: 11px; color: var(--color-neutral-600)\">Fiche introuvable — le lien ouvre la liste Wowhead filtrée sur ce nom.<\u002Fdiv>\n            <\u002Fsc-if>\n            <sc-if value=\"{{ aWhDown }}\" hint-placeholder-val=\"{{ false }}\">\n              <div style=\"font-size: 11px; color: var(--color-accent-300)\">Le serveur ne répond pas — les fiches Wowhead des nouveaux objets sont indisponibles. Le lien ci-dessus reste utilisable. L’attribution, elle, fonctionne normalement.<\u002Fdiv>\n            <\u002Fsc-if>\n          <\u002Fdiv>\n\n          <sc-if value=\"{{ aFromMythic }}\" hint-placeholder-val=\"{{ false }}\">\n            <div style=\"font-size: 11.5px; color: var(--color-neutral-400); padding: 6px 10px; border-radius: var(--radius-sm); border: 1px solid var(--color-neutral-800)\">Aucune sim héroïque n’existe — wowaudit ne l’autorise pas à l’équipe. Les prétendants et les gains affichés viennent de leur simulation mythique du même objet.<\u002Fdiv>\n          <\u002Fsc-if>\n          <sc-if value=\"{{ aHasMotif }}\" hint-placeholder-val=\"{{ false }}\">\n            <div style=\"font-size: 11.5px; color: var(--color-accent-300)\">{{ aMotifTxt }}<\u002Fdiv>\n          <\u002Fsc-if>\n          <sc-if value=\"{{ aSetItem }}\" hint-placeholder-val=\"{{ false }}\">\n            <div style=\"display: flex; gap: 8.4px; padding: 8.4px 11.2px; border-radius: var(--radius-sm); border: 1px solid var(--color-accent-800); background: var(--color-accent-900)\">\n              <span style=\"width: 6px; align-self: stretch; border-radius: 999px; background: var(--color-accent); flex: none\"><\u002Fspan>\n              <div style=\"font-size: 12px; color: var(--color-accent-100); max-width: 88ch; text-wrap: pretty\">{{ aSetNote }}<\u002Fdiv>\n            <\u002Fdiv>\n          <\u002Fsc-if>\n          <sc-if value=\"{{ aNoRows }}\" hint-placeholder-val=\"{{ false }}\">\n            <div style=\"font-size: 13px; color: var(--color-neutral-500)\">Personne du roster n’a cet objet dans sa wishlist.<\u002Fdiv>\n          <\u002Fsc-if>\n\n          <sc-if value=\"{{ aHasRows }}\" hint-placeholder-val=\"{{ false }}\">\n            <div style=\"overflow-x: auto\">\n              <sc-raw-table class=\"table\" style=\"min-width: 900px\">\n                <sc-raw-thead>\n                  <sc-raw-tr>\n                    <sc-raw-th style=\"width: 26px\">#<\u002Fsc-raw-th>\n                    <sc-raw-th style=\"min-width: 140px\">Joueur<\u002Fsc-raw-th>\n                    <sc-for list=\"{{ aCols }}\" as=\"c\" hint-placeholder-count=\"9\">\n                      <sc-raw-th style=\"font-size: 10px; white-space: nowrap\">{{ c }}<\u002Fsc-raw-th>\n                    <\u002Fsc-for>\n                    <sc-raw-th style=\"text-align: right\">Score<\u002Fsc-raw-th>\n                  <\u002Fsc-raw-tr>\n                <\u002Fsc-raw-thead>\n                <sc-raw-tbody>\n                  <sc-for list=\"{{ aRows }}\" as=\"r\" hint-placeholder-count=\"4\">\n                    <sc-raw-tr style=\"{{ r.rowStyle }}\">\n                      <sc-raw-td style=\"color: var(--color-neutral-600); font-size: 11px\">{{ r.rank }}<\u002Fsc-raw-td>\n                      <sc-raw-td>\n                        <span style=\"{{ r.nameStyle }}\">{{ r.pseudo }}<\u002Fspan>\n                        <sc-if value=\"{{ r.canRefresh }}\" hint-placeholder-val=\"{{ false }}\">\n                          <button class=\"btn btn-ghost\" title=\"{{ r.refreshTitle }}\" style=\"font-size: 11px; padding: 0 5px; margin-left: 4px; color: var(--color-neutral-500)\" style-hover=\"color: var(--color-accent)\" disabled=\"{{ r.refreshing }}\" sc-camel-on-click=\"{{ r.refresh }}\">{{ r.refreshLabel }}<\u002Fbutton>\n                        <\u002Fsc-if>\n                        <sc-if value=\"{{ r.tie }}\" hint-placeholder-val=\"{{ false }}\">\n                          <span class=\"tag tag-outline\" style=\"font-size: 9px; margin-left: 5px\">égalité<\u002Fspan>\n                        <\u002Fsc-if>\n                      <\u002Fsc-raw-td>\n                      <sc-for list=\"{{ r.cells }}\" as=\"cl\" hint-placeholder-count=\"9\">\n                        <sc-raw-td title=\"{{ cl.t }}\" style=\"font-size: 11.5px; color: var(--color-neutral-400); white-space: nowrap\">{{ cl.v }}<\u002Fsc-raw-td>\n                      <\u002Fsc-for>\n                      <sc-raw-td style=\"{{ r.scoreStyle }}\">{{ r.score }}<\u002Fsc-raw-td>\n\n                    <\u002Fsc-raw-tr>\n                  <\u002Fsc-for>\n                <\u002Fsc-raw-tbody>\n              <\u002Fsc-raw-table>\n            <\u002Fdiv>\n          <\u002Fsc-if>\n\n          <sc-if value=\"{{ aHasOthers }}\" hint-placeholder-val=\"{{ false }}\">\n            <div style=\"display: flex; flex-direction: column; gap: 5.6px; margin-top: 5.6px; padding-top: 8.4px; border-top: 1px solid var(--color-neutral-800)\">\n              <div style=\"font-size: 10px; letter-spacing: .08em; text-transform: uppercase; color: var(--color-neutral-600)\">{{ aOthersTitre }}<\u002Fdiv>\n              <div style=\"display: flex; flex-wrap: wrap; gap: 4px\">\n                <sc-for list=\"{{ aOthers }}\" as=\"o\" hint-placeholder-count=\"8\">\n                  <span style=\"{{ o.style }}\">{{ o.pseudo }}<\u002Fspan>\n                <\u002Fsc-for>\n              <\u002Fdiv>\n            <\u002Fdiv>\n          <\u002Fsc-if>\n        <\u002Fdiv>\n      <\u002Fdiv>\n    <\u002Fsc-if>\n\n    <sc-if value=\"{{ isWishlists }}\" hint-placeholder-val=\"{{ false }}\">\n      <div style=\"display: flex; flex-direction: column; gap: 11.2px\">\n        <div style=\"display: flex; align-items: center; gap: 11.2px; flex-wrap: wrap\">\n          <button class=\"btn btn-secondary\" style=\"font-size: 12px\" disabled=\"{{ waLoading }}\" sc-camel-on-click=\"{{ waRefresh }}\">{{ waRefreshLabel }}<\u002Fbutton>\n          <span style=\"font-size: 12px; color: var(--color-neutral-600)\">{{ waUpdated }}<\u002Fspan>\n          <button class=\"btn btn-primary\" style=\"font-size: 12px; margin-left: auto\" sc-camel-on-click=\"{{ wlCopyLate }}\">{{ wlLateLabel }}<\u002Fbutton>\n        <\u002Fdiv>\n        <sc-if value=\"{{ waErrAll }}\" hint-placeholder-val=\"{{ false }}\">\n          <div class=\"card elev-sm\"><div class=\"card-body\" style=\"margin: 0\">Wishlists indisponibles — {{ apiErrMsg }}<\u002Fdiv><\u002Fdiv>\n        <\u002Fsc-if>\n        <div style=\"display: flex; align-items: center; gap: 8.4px; flex-wrap: wrap\">\n          <input class=\"input\" style=\"font-size: 12px; min-height: 30px; width: 176px; flex: none\" placeholder=\"Chercher un joueur\" value=\"{{ wlSearch }}\" sc-camel-on-change=\"{{ wlSetSearch }}\">\n          <sc-for list=\"{{ wlFilters }}\" as=\"f\" hint-placeholder-count=\"2\">\n            <button class=\"btn\" style=\"{{ f.style }}\" sc-camel-on-click=\"{{ f.pick }}\">{{ f.label }}<\u002Fbutton>\n          <\u002Fsc-for>\n          <span style=\"font-size: 11px; color: var(--color-neutral-600)\">{{ wlSummary }}<\u002Fspan>\n        <\u002Fdiv>\n        <div style=\"display: flex; flex-wrap: wrap; gap: 8.4px; margin-bottom: 2px\">\n          <sc-for list=\"{{ wlCounts }}\" as=\"c\" hint-placeholder-count=\"4\">\n            <button style=\"{{ c.style }}\" sc-camel-on-click=\"{{ c.pick }}\">\n              <span style=\"{{ c.valStyle }}\">{{ c.value }}<\u002Fspan>\n              <span style=\"font-size: 10px; letter-spacing: .08em; text-transform: uppercase; color: var(--color-neutral-500); white-space: nowrap\">{{ c.label }}<\u002Fspan>\n            <\u002Fbutton>\n          <\u002Fsc-for>\n        <\u002Fdiv>\n        <div style=\"display: grid; grid-template-columns: repeat(auto-fill, minmax(180px, 1fr)); gap: 8.4px; align-items: start\">\n          <sc-for list=\"{{ wlCards }}\" as=\"w\" hint-placeholder-count=\"10\">\n            <button style=\"{{ w.cardStyle }}\" style-hover=\"{{ w.hover }}\" sc-camel-on-click=\"{{ w.open }}\">\n              <span style=\"display: flex; align-items: center; gap: 6px; width: 100%\">\n                <span style=\"{{ w.nameStyle }}\">{{ w.pseudo }}<\u002Fspan>\n                <span style=\"flex: 1 1 auto\"><\u002Fspan>\n                <span style=\"{{ w.pillStyle }}\">{{ w.pill }}<\u002Fspan>\n              <\u002Fspan>\n              <span style=\"font-size: 12.5px; color: var(--color-neutral-300)\">{{ w.count }}<\u002Fspan>\n              <span style=\"{{ w.subStyle }}\">{{ w.sub }}<\u002Fspan>\n              <span style=\"{{ w.tierStyle }}\">{{ w.tier }}<\u002Fspan>\n            <\u002Fbutton>\n          <\u002Fsc-for>\n        <\u002Fdiv>\n        <sc-if value=\"{{ wlNone }}\" hint-placeholder-val=\"{{ false }}\">\n          <div style=\"font-size: 12.5px; color: var(--color-neutral-500)\">Aucun joueur ne correspond à ce filtre.<\u002Fdiv>\n        <\u002Fsc-if>\n      <\u002Fdiv>\n    <\u002Fsc-if>\n\n    <sc-if value=\"{{ wlModalOpen }}\" hint-placeholder-val=\"{{ false }}\">\n      <div class=\"dialog-backdrop\" sc-camel-on-click=\"{{ wlM.close }}\">\n        <div class=\"dialog\" style=\"max-width: 700px; width: 100%; max-height: 86vh; overflow-y: auto; gap: 11.2px\" sc-camel-on-click=\"{{ stopProp }}\">\n          <div style=\"display: flex; align-items: flex-start; gap: 8.4px\">\n            <div style=\"display: flex; flex-direction: column; min-width: 0; flex: 1\">\n              <span style=\"{{ wlM.nameStyle }}\">{{ wlM.pseudo }}<\u002Fspan>\n              <span style=\"font-size: 11.5px; color: var(--color-neutral-500)\">{{ wlM.meta }}<\u002Fspan>\n            <\u002Fdiv>\n            <div style=\"display: flex; gap: 4px; flex: none\">\n              <button class=\"btn btn-ghost\" style=\"font-size: 12px; padding: 4px 8px\" sc-camel-on-click=\"{{ wlM.prev }}\">←<\u002Fbutton>\n              <button class=\"btn btn-ghost\" style=\"font-size: 12px; padding: 4px 8px\" sc-camel-on-click=\"{{ wlM.next }}\">→<\u002Fbutton>\n              <button class=\"btn btn-ghost\" style=\"font-size: 12px; padding: 4px 8px\" sc-camel-on-click=\"{{ wlM.close }}\">Fermer<\u002Fbutton>\n            <\u002Fdiv>\n          <\u002Fdiv>\n          <sc-if value=\"{{ wlM.hasSpecs }}\" hint-placeholder-val=\"{{ false }}\">\n            <div style=\"display: flex; flex-direction: column; gap: 2px\">\n              <sc-for list=\"{{ wlM.specLines }}\" as=\"s\" hint-placeholder-count=\"2\">\n                <div style=\"display: flex; gap: 8.4px; font-size: 11px\">\n                  <span style=\"color: var(--color-neutral-400)\">{{ s.spec }}<\u002Fspan>\n                  <span style=\"{{ s.dateStyle }}\">{{ s.date }}<\u002Fspan>\n                <\u002Fdiv>\n              <\u002Fsc-for>\n            <\u002Fdiv>\n          <\u002Fsc-if>\n          <div style=\"display: flex; align-items: center; flex-wrap: wrap; gap: 5.6px 8.4px; padding: 7px 9px; border-radius: var(--radius-md); background: var(--color-neutral-900); border: 1px solid var(--color-neutral-800)\">\n            <span style=\"font-size: 10px; letter-spacing: .1em; text-transform: uppercase; color: var(--color-neutral-500); white-space: nowrap\">Tier set<\u002Fspan>\n            <span style=\"display: flex; gap: 3px\">\n              <sc-for list=\"{{ wlM.tierPips }}\" as=\"tp\" hint-placeholder-count=\"5\">\n                <span title=\"{{ tp.title }}\" style=\"{{ tp.style }}\" sc-camel-on-click=\"{{ tp.toggle }}\">{{ tp.label }}<\u002Fspan>\n              <\u002Fsc-for>\n            <\u002Fspan>\n            <span style=\"font-size: 12px; font-variant-numeric: tabular-nums; color: var(--color-text); white-space: nowrap\">{{ wlM.tierLabel }}<\u002Fspan>\n            <span style=\"flex: 1 1 auto\"><\u002Fspan>\n            <span style=\"font-size: 10.5px; color: var(--color-neutral-600)\">{{ wlM.tierNote }}<\u002Fspan>\n          <\u002Fdiv>\n          <sc-if value=\"{{ wlM.hasItems }}\" hint-placeholder-val=\"{{ true }}\">\n            <div style=\"display: flex; gap: 4px; flex-wrap: wrap\">\n              <sc-for list=\"{{ wlM.diffs }}\" as=\"d\" hint-placeholder-count=\"2\">\n                <button class=\"btn\" style=\"{{ d.style }}\" sc-camel-on-click=\"{{ d.pick }}\">{{ d.label }}<\u002Fbutton>\n              <\u002Fsc-for>\n            <\u002Fdiv>\n            <div style=\"display: flex; flex-direction: column; gap: 11.2px\">\n              <sc-for list=\"{{ wlM.groups }}\" as=\"g\" hint-placeholder-count=\"3\">\n                <div style=\"display: flex; flex-direction: column; gap: 5.6px\">\n                  <div style=\"font-size: 11px; letter-spacing: .08em; text-transform: uppercase; color: var(--color-accent-300)\">{{ g.boss }}<\u002Fdiv>\n                  <sc-for list=\"{{ g.items }}\" as=\"i\" hint-placeholder-count=\"3\">\n                    <div style=\"display: flex; flex-direction: column; gap: 4px; padding-bottom: 5.6px; border-bottom: 1px solid var(--color-neutral-800)\">\n                      <div style=\"display: flex; align-items: baseline; gap: 8.4px\">\n                        <span style=\"{{ i.itemStyle }}\">{{ i.item }}<\u002Fspan>\n                        <sc-if value=\"{{ i.isContested }}\" hint-placeholder-val=\"{{ false }}\">\n                          <span class=\"tag tag-outline\" style=\"font-size: 9.5px; white-space: nowrap\">{{ i.contested }}<\u002Fspan>\n                        <\u002Fsc-if>\n                        <sc-if value=\"{{ i.manual }}\" hint-placeholder-val=\"{{ false }}\">\n                          <span class=\"tag tag-neutral\" style=\"font-size: 9.5px; white-space: nowrap\">saisi à la main<\u002Fspan>\n                        <\u002Fsc-if>\n                        <sc-if value=\"{{ i.done }}\" hint-placeholder-val=\"{{ false }}\">\n                          <span class=\"tag tag-neutral\" style=\"font-size: 9.5px; white-space: nowrap\">déjà attribué<\u002Fspan>\n                        <\u002Fsc-if>\n                        <span title=\"{{ i.gainTitle }}\" style=\"{{ i.gainStyle }}\">{{ i.gain }}<\u002Fspan>\n                      <\u002Fdiv>\n                      <div style=\"display: flex; align-items: center; gap: 8.4px\">\n                        <div style=\"height: 3px; flex: 1; background: var(--color-neutral-800); border-radius: 2px; overflow: hidden\">\n                          <div style=\"{{ i.barStyle }}\"><\u002Fdiv>\n                        <\u002Fdiv>\n                        <span style=\"font-size: 10.5px; color: var(--color-neutral-500); white-space: nowrap\">{{ i.meta }}<\u002Fspan>\n                      <\u002Fdiv>\n                    <\u002Fdiv>\n                  <\u002Fsc-for>\n                <\u002Fdiv>\n              <\u002Fsc-for>\n            <\u002Fdiv>\n          <\u002Fsc-if>\n          <sc-if value=\"{{ wlM.noItems }}\" hint-placeholder-val=\"{{ false }}\">\n            <div style=\"font-size: 12.5px; color: var(--color-neutral-500)\">Aucun Droptimizer remonté par wowaudit pour ce joueur.<\u002Fdiv>\n          <\u002Fsc-if>\n          <div class=\"dialog-actions\">\n            <button class=\"btn btn-secondary\" style=\"font-size: 12px\" sc-camel-on-click=\"{{ wlM.copyMp }}\">{{ wlM.mpLabel }}<\u002Fbutton>\n          <\u002Fdiv>\n        <\u002Fdiv>\n      <\u002Fdiv>\n    <\u002Fsc-if>\n\n    <sc-if value=\"{{ copyBoxOpen }}\" hint-placeholder-val=\"{{ false }}\">\n      <div class=\"dialog-backdrop\">\n        <div class=\"dialog\" style=\"max-width: 520px\">\n          <div class=\"dialog-title\">Copier le message<\u002Fdiv>\n          <div class=\"dialog-body\" style=\"display: flex; flex-direction: column; gap: 8.4px\">\n            <div style=\"font-size: 12px; color: var(--color-neutral-500)\">La copie automatique est bloquée ici. Le texte est sélectionné : Ctrl+C (ou Cmd+C).<\u002Fdiv>\n            <textarea class=\"input\" readonly=\"readonly\" rows=\"5\" style=\"font-size: 12.5px; line-height: 1.5; resize: vertical\" ref=\"{{ copyBoxRef }}\">{{ copyBoxText }}<\u002Ftextarea>\n          <\u002Fdiv>\n          <div class=\"dialog-actions\">\n            <button class=\"btn btn-primary\" style=\"font-size: 12px\" sc-camel-on-click=\"{{ copyBoxClose }}\">Fermer<\u002Fbutton>\n          <\u002Fdiv>\n        <\u002Fdiv>\n      <\u002Fdiv>\n    <\u002Fsc-if>\n\n    <sc-if value=\"{{ tourOpen }}\" hint-placeholder-val=\"{{ false }}\">\n      <div class=\"dialog-backdrop\">\n        <div class=\"dialog\" style=\"max-width: 440px\">\n          <div class=\"card-kicker\">{{ tourStep.k }}<\u002Fdiv>\n          <div class=\"dialog-title\" style=\"margin-top: 4px\">{{ tourStep.t }}<\u002Fdiv>\n          <div class=\"dialog-body\" style=\"text-wrap: pretty\">{{ tourStep.d }}<\u002Fdiv>\n          <div class=\"dialog-actions\" style=\"align-items: center\">\n            <span style=\"font-size: 11px; color: var(--color-neutral-600); margin-right: auto\">{{ tourNum }}<\u002Fspan>\n            <button class=\"btn btn-ghost\" style=\"font-size: 12px\" sc-camel-on-click=\"{{ tourClose }}\">Passer<\u002Fbutton>\n            <sc-if value=\"{{ tourNotLast }}\" hint-placeholder-val=\"{{ true }}\">\n              <button class=\"btn btn-primary\" sc-camel-on-click=\"{{ tourNext }}\">Suivant<\u002Fbutton>\n            <\u002Fsc-if>\n            <sc-if value=\"{{ tourLast }}\" hint-placeholder-val=\"{{ false }}\">\n              <button class=\"btn btn-primary\" sc-camel-on-click=\"{{ tourClose }}\">C'est parti<\u002Fbutton>\n            <\u002Fsc-if>\n          <\u002Fdiv>\n        <\u002Fdiv>\n      <\u002Fdiv>\n    <\u002Fsc-if>\n\n\n  <\u002Fmain>\n<\u002Fdiv>\n<\u002Fsc-if>\n\n<sc-if value=\"{{ checking }}\" hint-placeholder-val=\"{{ false }}\">\n  <div style=\"min-height: 100vh; display: grid; place-items: center; background: var(--color-bg); color: var(--color-neutral-400); font-family: var(--font-body); font-size: 13px\">Vérification de votre compte Discord…<\u002Fdiv>\n<\u002Fsc-if>\n\n<sc-if value=\"{{ notAuthed }}\" hint-placeholder-val=\"{{ true }}\">\n  <div style=\"min-height: 100vh; display: grid; place-items: center; background: var(--color-bg); color: var(--color-text); font-family: var(--font-body); padding: 22.4px\">\n    <div class=\"card elev-md\" style=\"max-width: 420px; text-align: center; align-items: center; padding: 22.4px\">\n      <div class=\"card-kicker\">Gilt Sky Gaming<\u002Fdiv>\n      <h3 style=\"margin: 5.6px 0 8.4px\">Accès officiers<\u002Fh3>\n      <div class=\"card-body\" style=\"text-align: center\">Outil de gestion réservé aux quatre officiers. Connectez-vous avec votre compte Discord.<\u002Fdiv>\n      <sc-if value=\"{{ discordErr }}\" hint-placeholder-val=\"{{ false }}\">\n        <div style=\"font-size: 12px; color: var(--color-accent-300); margin-top: 8.4px\">{{ discordErrMsg }}<\u002Fdiv>\n      <\u002Fsc-if>\n      <sc-if value=\"{{ isPreview }}\" hint-placeholder-val=\"{{ false }}\">\n        <button class=\"btn btn-primary\" style=\"margin-top: 16.8px\" sc-camel-on-click=\"{{ fakeLogin }}\">Se connecter avec Discord<\u002Fbutton>\n        <div style=\"font-size: 11px; color: var(--color-neutral-600); margin-top: 8.4px\">Aperçu : connexion simulée en tant que Céhèm.<\u002Fdiv>\n      <\u002Fsc-if>\n      <a href=\"{{ discordLoginUrl }}\" class=\"btn btn-primary\" style=\"{{ realLoginStyle }}\">Se connecter avec Discord<\u002Fa>\n    <\u002Fdiv>\n  <\u002Fdiv>\n<\u002Fsc-if>\n<\u002Fx-dc>\n<script type=\"text/x-dc\" data-dc-script=\"\" data-props=\"{&quot;$preview&quot;:{&quot;width&quot;:1440,&quot;height&quot;:900}}\">\nconst CLS = {\n  War: { a: 'Plaques', t: 'Zenith', s: { Arms: ['DD', 'Mêlée', 'Force'], Fury: ['DD', 'Mêlée', 'Force'], Protection: ['Tank', 'Mêlée', 'Force'] } },\n  Pal: { a: 'Plaques', t: 'Zenith', s: { Holy: ['Heal', 'Distance', 'Intelligence'], Protection: ['Tank', 'Mêlée', 'Force'], Retribution: ['DD', 'Mêlée', 'Force'] } },\n  DK: { a: 'Plaques', t: 'Zenith', s: { Blood: ['Tank', 'Mêlée', 'Force'], Frost: ['DD', 'Mêlée', 'Force'], Unholy: ['DD', 'Mêlée', 'Force'] } },\n  Hunter: { a: 'Mailles', t: 'Venerated', s: { 'Beast Mastery': ['DD', 'Distance', 'Agilité'], Marksmanship: ['DD', 'Distance', 'Agilité'], Survival: ['DD', 'Mêlée', 'Agilité'] } },\n  Sham: { a: 'Mailles', t: 'Venerated', s: { Elemental: ['DD', 'Distance', 'Intelligence'], Enhancement: ['DD', 'Mêlée', 'Agilité'], Restoration: ['Heal', 'Distance', 'Intelligence'] } },\n  Evoker: { a: 'Mailles', t: 'Venerated', s: { Devastation: ['DD', 'Distance', 'Intelligence'], Preservation: ['Heal', 'Distance', 'Intelligence'], Augmentation: ['Aug', 'Distance', 'Intelligence'] } },\n  Rogue: { a: 'Cuir', t: 'Mystic', s: { Assassination: ['DD', 'Mêlée', 'Agilité'], Outlaw: ['DD', 'Mêlée', 'Agilité'], Subtlety: ['DD', 'Mêlée', 'Agilité'] } },\n  Monk: { a: 'Cuir', t: 'Mystic', s: { Brewmaster: ['Tank', 'Mêlée', 'Agilité'], Mistweaver: ['Heal', 'Distance', 'Intelligence'], Windwalker: ['DD', 'Mêlée', 'Agilité'] } },\n  Druid: { a: 'Cuir', t: 'Mystic', s: { Balance: ['DD', 'Distance', 'Intelligence'], Feral: ['DD', 'Mêlée', 'Agilité'], Guardian: ['Tank', 'Mêlée', 'Agilité'], Restoration: ['Heal', 'Distance', 'Intelligence'] } },\n  DH: { a: 'Cuir', t: 'Mystic', s: { Havoc: ['DD', 'Mêlée', 'Agilité'], Vengeance: ['Tank', 'Mêlée', 'Agilité'], Devourer: ['DD', 'Distance', 'Intelligence'] } },\n  Priest: { a: 'Tissu', t: 'Dreadful', s: { Discipline: ['Heal', 'Distance', 'Intelligence'], Holy: ['Heal', 'Distance', 'Intelligence'], Shadow: ['DD', 'Distance', 'Intelligence'] } },\n  Mage: { a: 'Tissu', t: 'Dreadful', s: { Arcane: ['DD', 'Distance', 'Intelligence'], Fire: ['DD', 'Distance', 'Intelligence'], Frost: ['DD', 'Distance', 'Intelligence'] } },\n  Lock: { a: 'Tissu', t: 'Dreadful', s: { Affliction: ['DD', 'Distance', 'Intelligence'], Demonology: ['DD', 'Distance', 'Intelligence'], Destruction: ['DD', 'Distance', 'Intelligence'] } }\n};\nconst CLASSES = Object.keys(CLS);\nconst KLASS_COLOR = {\n  'Death Knight': '#c41e3a', 'Demon Hunter': '#a330c9', 'Druid': '#ff7c0a', 'Evoker': '#33937f',\n  'Hunter': '#aad372', 'Mage': '#3fc7eb', 'Monk': '#00ff98', 'Paladin': '#f48cba',\n  'Priest': '#e9e9ed', 'Rogue': '#fff468', 'Shaman': '#0070dd', 'Warlock': '#8788ee', 'Warrior': '#c69b6d'\n};\nfunction klassColor(k) { return KLASS_COLOR[k] || 'var(--color-neutral-400)'; }\nconst CLS_COLOR = {\n  War: '#C69B6D', Pal: '#F48CBA', DK: '#C41E3A', Hunter: '#AAD372', Sham: '#0070DD',\n  Evoker: '#33937F', Rogue: '#FFF468', Monk: '#00FF98', Druid: '#FF7C0A', DH: '#A330C9',\n  Priest: '#D8D8DF', Mage: '#3FC7EB', Lock: '#8788EE'\n};\nconst ROLES = ['Tank', 'Heal', 'DPS CaC', 'DPS Distance'];\nconst CLS_ABBR = {\n  War: 'WA', Pal: 'PA', DK: 'DK', Hunter: 'CH', Sham: 'CM', Evoker: 'EV', Rogue: 'VO',\n  Monk: 'MO', Druid: 'DR', DH: 'DH', Priest: 'PR', Mage: 'MA', Lock: 'DE'\n};\n// Chaque rôle a sa teinte et sa lettre : la carte se reconnaît d'un coup d'œil\n// sans dépendre d'un jeu d'icônes externe.\nconst ROLE_SKIN = {\n  'Tank': { c: '#5aa9b5', g: 'T' },\n  'Heal': { c: '#5cb87f', g: 'H' },\n  'DPS CaC': { c: '#e0673c', g: 'M' },\n  'DPS Distance': { c: '#c9564f', g: 'D' },\n  'Sans rôle': { c: '#7c7f95', g: '?' },\n  'Tous': { c: '#9184d9', g: '≡' }\n};\nfunction realmSlug(r) {\n  return (r || 'Ysondre').toLowerCase().normalize('NFD').replace(/[\\u0300-\\u036f]/g, '').replace(/['’]/g, '').replace(/\\s+/g, '-');\n}\nconst FULL_TO_CLS = {\n  'Death Knight': 'DK', 'Demon Hunter': 'DH', 'Druid': 'Druid', 'Evoker': 'Evoker', 'Hunter': 'Hunter',\n  'Mage': 'Mage', 'Monk': 'Monk', 'Paladin': 'Pal', 'Priest': 'Priest', 'Rogue': 'Rogue',\n  'Shaman': 'Sham', 'Warlock': 'Lock', 'Warrior': 'War'\n};\nconst BUFFS = [\n  ['Intelligence', 'Intelligence de l’Arcane', ['Mage']],\n  ['Puissance d’attaque', 'Cri de guerre', ['War']],\n  ['Endurance', 'Robustesse', ['Priest']],\n  ['Polyvalence', 'Marque du Sauvage', ['Druid']],\n  ['Toucher mystique', '+5 % dégâts physiques subis', ['Monk']],\n  ['Marque du chaos', '+5 % dégâts magiques subis', ['DH']],\n  ['Furie du ciel', 'Hâte et coup critique', ['Sham']],\n  ['Bénédiction du bronze', 'Vitesse de déplacement', ['Evoker']],\n  ['Bénédictions', 'Protection et immunités', ['Pal']],\n  ['Héroïsme', 'Hâte de raid', ['Sham', 'Mage', 'Evoker', 'Hunter']],\n  ['Rez de combat', 'Résurrection en combat', ['Druid', 'DK', 'Lock', 'Pal']]\n];\nfunction buffRows(classCounts) {\n  return BUFFS.map(function (b) {\n    const holders = b[2].filter(function (c) { return (classCounts[c] || 0) > 0; });\n    const ok = holders.length > 0;\n    return {\n      nom: b[0], sous: b[1], ok: ok, manque: !ok,\n      par: ok ? holders.map(function (c) { return c + ' ×' + classCounts[c]; }).join(' · ') : 'Aucun ' + b[2].join(' / '),\n      dotStyle: 'width: 8px; height: 8px; border-radius: 50%; flex: none; background: ' + (ok ? 'var(--color-accent)' : 'var(--color-neutral-500)'),\n      style: 'display: flex; align-items: center; gap: 8.4px; padding: 5.6px 8.4px; border-radius: var(--radius-sm); border: 1px solid var(--color-neutral-800); background: ' + (ok ? 'transparent' : 'var(--color-neutral-900)'),\n      nomStyle: 'font-size: 12.5px; color: ' + (ok ? 'var(--color-text)' : 'var(--color-neutral-300)')\n    };\n  });\n}\nconst STAT_TIER = { 'Officier': 3, 'Raid Lead': 3, 'Titulaire': 2, 'Apply': 1, 'Interessé': 1, 'Backup': 0, 'Inactif': 0 };\nfunction specBucket(sp) {\n  if (!sp) return '';\n  return sp[0] === 'Tank' ? 'Tank' : sp[0] === 'Heal' ? 'Heal' : sp[1] === 'Mêlée' ? 'DPS CaC' : 'DPS Distance';\n}\n// La base stocke des abréviations de classe ; l'écran doit dire le nom entier.\nconst CLS_FR = {\n  War: 'Guerrier', Pal: 'Paladin', DK: 'Chevalier de la mort', Hunter: 'Chasseur',\n  Rogue: 'Voleur', Priest: 'Prêtre', Sham: 'Chaman', Mage: 'Mage', Lock: 'Démoniste',\n  Monk: 'Moine', Druid: 'Druide', DH: 'Chasseur de démons', Evoker: 'Évocateur'\n};\nconst STATUTS = ['Officier', 'Raid Lead', 'Titulaire', 'Apply', 'Interessé', 'Backup', 'Inactif'];\nconst COUNTED = ['Officier', 'Raid Lead', 'Titulaire'];\n// Statuts dont wowaudit fait foi : ceux-là sont censés exister côté wowaudit,\n// donc leur absence signale un départ. Les apply et les curieux se saisissent\n// à la main — ils ne doivent jamais être proposés à la suppression.\nconst WA_OWNED = ['Officier', 'Raid Lead', 'Titulaire', 'Backup', 'Inactif'];\n// Estampille de build — incrémentée à chaque livraison, sert à vérifier\n// d'un coup d'œil que le navigateur charge bien la dernière version.\nconst BUILD = 'v1.93.3 · 2026-09-09';\nconst DIFFS = ['Mythique', 'Héroïque', 'Normal', 'Recherche de raid'];\nconst DIFF_ILVL = { 'Héroïque': 13, 'Normal': 26, 'Recherche de raid': 39 };\nconst DIFF_EN = { 'Mythique': 'Mythic', 'Héroïque': 'Heroic', 'Normal': 'Normal', 'Recherche de raid': 'Raid Finder' };\nfunction tipIlvl(d) {\n  if (d && typeof d.ilvl === 'number') return d.ilvl;\n  const txt = String(d && d.html).replace(/<!--[\\s\\S]*?-->/g, '').replace(/<[^>]*>/g, ' ');\n  const m = txt.match(/Item Level\\s*(\\d+)/i) || txt.match(/Niveau d.objet\\s*(\\d+)/i);\n  return m ? +m[1] : null;\n}\nconst CATS = ['Standard', 'Set (jeton)', 'Arme', 'Bijou'];\nconst SLOTS = ['tete', 'epaules', 'torse', 'mains', 'jambes'];\nconst SLOT_FR = { tete: 'Tête', epaules: 'Épaules', torse: 'Torse', mains: 'Mains', jambes: 'Jambes' };\nconst SLOT_LABELS = { tete: 'Tête', epaules: 'Épaules', torse: 'Torse', mains: 'Mains', jambes: 'Jambes' };\n// Tier saison 2 : deux compteurs cohabitent. Les cases plates de data.tier sont\n// la S1 (lecture seule) ; la S2 se déduit du journal de loot depuis cette date,\n// slot par slot, et un officier peut corriger chaque case à la main.\nconst SEASON_TIER = '2026-08-19';\n// Le français rend « dimanche 16 août » en minuscule ; en tête de bloc, le jour\n// est un début de phrase.\nfunction capFr(s) { return s ? String(s).charAt(0).toUpperCase() + String(s).slice(1) : s; }\nconst SLOT_ALIAS = {\n  tete: 'tete', head: 'tete', helm: 'tete', helmet: 'tete', casque: 'tete',\n  epaules: 'epaules', epaule: 'epaules', shoulder: 'epaules', shoulders: 'epaules', epaulieres: 'epaules',\n  torse: 'torse', chest: 'torse', plastron: 'torse', robe: 'torse',\n  mains: 'mains', main: 'mains', hands: 'mains', hand: 'mains', gants: 'mains', gloves: 'mains',\n  jambes: 'jambes', jambe: 'jambes', legs: 'jambes', leg: 'jambes', pantalon: 'jambes'\n};\nfunction tierSlotKey(raw) {\n  const k = String(raw || '').toLowerCase().normalize('NFD').replace(/[\\u0300-\\u036f]/g, '').replace(/[^a-z]/g, '');\n  return SLOT_ALIAS[k] || '';\n}\n// Warcraft Logs range les ressources selon le type d'événement : tantôt\n// targetResources, tantôt resources, parfois au premier niveau. On lit toutes\n// les formes plutôt qu'une seule, sinon les PV max manquent en silence.\nfunction evMaxHp(e) {\n  if (!e) return 0;\n  const pots = [e.targetResources, e.resources, e.sourceResources, e];\n  for (const c of pots) {\n    if (!c || typeof c !== 'object') continue;\n    const v = c.maxHitPoints != null ? c.maxHitPoints\n      : c.maxHitpoints != null ? c.maxHitpoints\n      : c.hitPointsMax != null ? c.hitPointsMax\n      : c.maxHP != null ? c.maxHP : null;\n    if (v) return v;\n  }\n  return 0;\n}\nconst BOSS_STATUTS = ['À faire', 'En progress', 'Kill', 'Skip'];\nconst KEY = 'gsg_dash_v1';\nconst SB_URL = 'https://tzjwxuufiiatwotbufkz.supabase.co';\nconst SB_KEY = 'sb_publishable_C24faTXfPtwnqM813S5eTA_dmNLoNbA';\nconst DISCORD_CLIENT_ID = '1536765349788131338';\nconst DISCORD_GUILD_ID = '371361547576016899';\nconst TOUR = [\n  { k: 'Bienvenue', t: 'Le portail de la guilde', d: \"Tout ce qui concerne le raid vit ici : ta présence, tes objets, la compo. Ton compte Discord t'identifie — rien à retenir.\" },\n  { k: 'Étape 1', t: 'Conf ion () {\n    return new Promise(function (res, rej) {\n      if (document.getElementById('sb-cdn-retry')) return rej(new Error('absent'));\n      const el = document.createElement('script');\n      el.id = 'sb-cdn-retry';\n      el.src = SB_CDN;\n      el.onload = function () { const s = sbReady(); s ? res(s) : rej(new Error('absent')); };\n      el.onerror = function () { rej(new Error('absent')); };\n      document.head.appendChild(el);\n    });\n  });\n}\n// ── Warcraft Logs appelé depuis le navigateur.\n// Cloudflare ne fabrique que le jeton : l'appel part de la machine de\n// l'officier, donc la limite par IP de Warcraft Logs devient la sienne au lieu\n// d'une IP partagée. Si l'appel direct échoue (réseau d'entreprise, CORS), on\n// retombe sur les routes serveur, qui renvoient déjà la donnée mise en forme.\nconst WCL_GQL = 'https://www.warcraftlogs.com/api/v2/client';\nconst WQ = {\n  reports: 'query($g:String!,$s:String!,$r:String!,$limit:Int!){ reportData{ reports(guildName:$g, guildServerSlug:$s, guildServerRegion:$r, limit:$limit){ data{ code title startTime endTime zone{ id name } owner{ name } } } } }',\n  report: 'query($code:String!){ reportData{ report(code:$code){ title startTime endTime zone{ id name } masterData(translate:true){ actors(type:\"Player\"){ id name subType server type } abilities{ gameID name type } } fights{ id name encounterID difficulty kill fightPercentage startTime endTime averageItemLevel friendlyPlayers lastPhase } } } }',\n  deaths: 'query($code:String!,$start:Float!,$end:Float!){ reportData{ report(code:$code){ events(dataType: Deaths, startTime:$start, endTime:$end, limit:500, includeResources: true){ data } } } }',\n  table: 'query($code:String!,$start:Float!,$end:Float!){ reportData{ report(code:$code){ table(dataType: DamageTaken, startTime:$start, endTime:$end) } } }',\n  dmgEvents: 'query($code:String!,$start:Float!,$end:Float!){ reportData{ report(code:$code){ events(dataType: DamageTaken, startTime:$start, endTime:$e
